<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0510"/>
      <stop offset="60%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <style>
      .star { fill: #ffffff; animation: twinkle 4s infinite alternate; }
      .shooting-star { animation: shoot 3s infinite linear; opacity: 0; }
      .moon { animation: pulse 5s infinite alternate; }
      
      @keyframes twinkle { 
        0% { opacity: 0.2; transform: scale(0.8); } 
        100% { opacity: 1; transform: scale(1.2); } 
      }
      @keyframes pulse { 
        0% { transform: scale(1); opacity: 0.8; } 
        100% { transform: scale(1.05); opacity: 1; } 
      }
      @keyframes shoot {
        0% { transform: translate(0, 0) rotate(-45deg); opacity: 0; }
        10% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translate(300px, 300px) rotate(-45deg); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGrad)"/>

  <!-- Glowing Moon -->
  <g class="moon">
    <circle cx="950" cy="80" r="80" fill="url(#moonGlow)"/>
    <circle cx="950" cy="80" r="35" fill="#f8fafc"/>
    <circle cx="940" cy="75" r="6" fill="#e2e8f0" opacity="0.6"/>
    <circle cx="960" cy="90" r="9" fill="#e2e8f0" opacity="0.4"/>
    <circle cx="955" cy="70" r="4" fill="#e2e8f0" opacity="0.5"/>
    <circle cx="935" cy="95" r="5" fill="#e2e8f0" opacity="0.3"/>
  </g>

  <!-- Static Stars -->
  <g class="star">
    <circle cx="100" cy="50" r="1.5" style="animation-delay: 0s;"/>
    <circle cx="250" cy="90" r="1" style="animation-delay: 1.5s;"/>
    <circle cx="400" cy="40" r="2" style="animation-delay: 0.8s;"/>
    <circle cx="550" cy="70" r="1.2" style="animation-delay: 2.2s;"/>
    <circle cx="700" cy="30" r="1.8" style="animation-delay: 1.1s;"/>
    <circle cx="850" cy="60" r="1" style="animation-delay: 3s;"/>
    <circle cx="1100" cy="50" r="1.5" style="animation-delay: 0.5s;"/>
    <circle cx="1150" cy="120" r="1.2" style="animation-delay: 2.7s;"/>
    <circle cx="50" cy="150" r="1" style="animation-delay: 1.8s;"/>
    <circle cx="180" cy="130" r="1.5" style="animation-delay: 0.3s;"/>
    <circle cx="300" cy="180" r="1" style="animation-delay: 2s;"/>
    <circle cx="650" cy="160" r="1.5" style="animation-delay: 1.4s;"/>
  </g>

  <!-- Shooting Stars -->
  <g>
    <path class="shooting-star" d="M 200 50 L 220 50 L 210 70 Z" fill="#ffffff" style="animation-delay: 0s;"/>
    <path class="shooting-star" d="M 600 80 L 620 80 L 610 100 Z" fill="#ffffff" style="animation-delay: 1.5s;"/>
    <path class="shooting-star" d="M 400 20 L 420 20 L 410 40 Z" fill="#ffffff" style="animation-delay: 3s;"/>
    <path class="shooting-star" d="M 800 40 L 820 40 L 810 60 Z" fill="#ffffff" style="animation-delay: 4.5s;"/>
  </g>
</svg>
