<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05020a"/>
      <stop offset="60%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a0b2e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  
  <style>
    .star { fill: #d8b4fe; animation: twinkle 4s infinite alternate; }
    .cloud { animation: drift 25s infinite linear; }
    @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.9; } }
    @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-100px); } }
  </style>

  <rect width="100%" height="100%" fill="url(#skyGrad)"/>
  
  <!-- Stars -->
  <g class="star">
    <circle cx="100" cy="50" r="1.5" style="animation-delay: 0s;"/>
    <circle cx="300" cy="80" r="1" style="animation-delay: 1.5s;"/>
    <circle cx="550" cy="40" r="2" style="animation-delay: 0.8s;"/>
    <circle cx="800" cy="90" r="1.5" style="animation-delay: 2.2s;"/>
    <circle cx="1050" cy="60" r="1" style="animation-delay: 1.1s;"/>
    <circle cx="1150" cy="120" r="1.5" style="animation-delay: 3s;"/>
  </g>

  <!-- Clouds -->
  <g class="cloud" fill="url(#cloudGrad)" filter="url(#blur)">
    <ellipse cx="200" cy="220" rx="250" ry="60"/>
    <ellipse cx="600" cy="240" rx="300" ry="70"/>
    <ellipse cx="1000" cy="210" rx="280" ry="60"/>
  </g>
</svg>
