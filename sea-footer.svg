<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05020a"/>
      <stop offset="100%" stop-color="#140726"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d0a4c"/>
      <stop offset="100%" stop-color="#140726"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#59108a"/>
      <stop offset="100%" stop-color="#2d0a4c"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b1ec4"/>
      <stop offset="100%" stop-color="#3d0a6e"/>
    </linearGradient>
    <linearGradient id="wave4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c55cff"/>
      <stop offset="100%" stop-color="#59108a"/>
    </linearGradient>
    <linearGradient id="wave5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6b3ff"/>
      <stop offset="100%" stop-color="#8b1ec4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="600" cy="150" r="250" fill="#8b1ec4" opacity="0.15" filter="url(#glowStrong)"/>
  <path fill="url(#wave1)" opacity="0.6">
    <animate attributeName="d" values="M0,180 Q300,160 600,180 T1200,180 L1200,300 L0,300 Z;M0,190 Q300,210 600,190 T1200,190 L1200,300 L0,300 Z;M0,180 Q300,160 600,180 T1200,180 L1200,300 L0,300 Z" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave2)" opacity="0.7">
    <animate attributeName="d" values="M0,210 Q400,190 800,210 T1200,210 L1200,300 L0,300 Z;M0,220 Q400,240 800,220 T1200,220 L1200,300 L0,300 Z;M0,210 Q400,190 800,210 T1200,210 L1200,300 L0,300 Z" dur="6s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave3)" opacity="0.85" filter="url(#glow)">
    <animate attributeName="d" values="M0,240 Q500,220 1000,240 T1200,240 L1200,300 L0,300 Z;M0,250 Q500,270 1000,250 T1200,250 L1200,300 L0,300 Z;M0,240 Q500,220 1000,240 T1200,240 L1200,300 L0,300 Z" dur="5s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave4)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="d" values="M0,270 Q600,250 1200,270 L1200,300 L0,300 Z;M0,280 Q600,300 1200,280 L1200,300 L0,300 Z;M0,270 Q600,250 1200,270 L1200,300 L0,300 Z" dur="4s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave5)" opacity="0.95" filter="url(#glowStrong)">
    <animate attributeName="d" values="M0,290 Q600,280 1200,290 L1200,300 L0,300 Z;M0,295 Q600,305 1200,295 L1200,300 L0,300 Z;M0,290 Q600,280 1200,290 L1200,300 L0,300 Z" dur="3s" repeatCount="indefinite"/>
  </path>
  <g fill="#e6b3ff" filter="url(#glow)">
    <circle cx="200" cy="260" r="2" opacity="0.6">
      <animate attributeName="cy" values="260;240;260" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="280" r="1.5" opacity="0.5">
      <animate attributeName="cy" values="280;260;280" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="270" r="2.5" opacity="0.7">
      <animate attributeName="cy" values="270;250;270" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="285" r="1.8" opacity="0.4">
      <animate attributeName="cy" values="285;265;285" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="290" r="2" opacity="0.5">
      <animate attributeName="cy" values="290;270;290" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="260" r="1.5" opacity="0.6">
      <animate attributeName="cy" values="260;240;260" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
