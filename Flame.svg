<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05020a"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="flameBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flameFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    .bg { fill: url(#bg); }
    .flame { transform-origin: bottom center; }
    .f1 { animation: flicker 1.5s infinite alternate ease-in-out; }
    .f2 { animation: flicker 2.2s infinite alternate-reverse ease-in-out; }
    .f3 { animation: flicker 1.8s infinite alternate ease-in-out; }
    @keyframes flicker {
      0% { transform: scaleY(1) skewX(0deg); opacity: 0.8; }
      50% { transform: scaleY(1.1) skewX(1deg); opacity: 1; }
      100% { transform: scaleY(0.95) skewX(-1deg); opacity: 0.7; }
    }
  </style>
  
  <rect width="100%" height="100%" class="bg" />

  <g class="flame f3" fill="url(#flameBack)" opacity="0.6">
    <path d="M 0,300 L 50,180 L 80,220 L 120,120 L 150,200 L 200,140 L 240,250 L 300,300 Z" />
    <path d="M 250,300 L 320,150 L 350,240 L 420,100 L 450,190 L 500,130 L 550,220 L 600,300 Z" />
    <path d="M 550,300 L 650,170 L 680,250 L 750,80 L 780,200 L 850,120 L 900,230 L 950,300 Z" />
    <path d="M 850,300 L 920,160 L 960,240 L 1020,110 L 1060,210 L 1120,140 L 1160,250 L 1200,300 Z" />
  </g>

  <g class="flame f2" fill="url(#flameMid)" opacity="0.8" filter="url(#glow)">
    <path d="M 0,300 L 30,210 L 60,260 L 100,160 L 130,250 L 180,190 L 220,280 L 280,300 Z" />
    <path d="M 200,300 L 280,190 L 320,260 L 380,130 L 420,230 L 480,160 L 540,260 L 600,300 Z" />
    <path d="M 500,300 L 580,180 L 620,260 L 680,120 L 720,220 L 780,150 L 840,260 L 900,300 Z" />
    <path d="M 800,300 L 880,190 L 920,260 L 980,140 L 1020,240 L 1080,170 L 1120,260 L 1200,300 Z" />
  </g>

  <g class="flame f1" fill="url(#flameFront)" opacity="0.9" filter="url(#glow)">
    <path d="M 0,300 L 20,240 L 40,280 L 80,190 L 110,270 L 150,220 L 190,290 L 240,300 Z" />
    <path d="M 160,300 L 230,210 L 260,270 L 310,150 L 340,240 L 390,180 L 440,270 L 490,300 Z" />
    <path d="M 420,300 L 490,200 L 530,280 L 580,140 L 620,250 L 670,180 L 720,270 L 780,300 Z" />
    <path d="M 700,300 L 760,220 L 800,280 L 850,160 L 890,250 L 940,190 L 980,280 L 1040,300 Z" />
    <path d="M 950,300 L 1020,210 L 1060,280 L 1110,160 L 1150,250 L 1180,200 L 1200,240 L 1200,300 Z" />
  </g>
</svg>
