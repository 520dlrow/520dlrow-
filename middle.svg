<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3a5c"/>
      <stop offset="12%" stop-color="#0a1220"/>
      <stop offset="88%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#050f1e"/>
    </linearGradient>
    <style>
      .t1 { font-family: 'Grenze Gotisch', serif; font-weight: 700; font-size: 26px; fill: #eaf2ff; }
      .t2 { font-family: 'Grenze Gotisch', serif; font-weight: 700; font-size: 18px; fill: #a9c2ee; }
      .t3 { font-family: 'Grenze Gotisch', serif; font-weight: 700; font-size: 20px; fill: #dce9ff; }
      .t4 { font-family: 'Grenze Gotisch', serif; font-weight: 700; font-size: 22px; fill: #eaf2ff; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#midGrad)"/>
  <g text-anchor="middle">
    <text x="600" y="50" class="t1">&gt; whoami</text>
    <text x="600" y="85" class="t1">Mohamed Cheikh // MC88</text>
    <text x="600" y="120" class="t1">&gt; cat about.txt</text>

    <text x="600" y="165" class="t2">I study computer science in Mauritania.</text>
    <text x="600" y="195" class="t2">In my free time I build small web tools.</text>
    <text x="600" y="225" class="t2">All of them are things I wanted to exist.</text>
    <text x="600" y="255" class="t2">So I made them.</text>

    <text x="600" y="300" class="t2">This is a hobby, not a company.</text>
    <text x="600" y="330" class="t2">I build at my own pace.</text>
    <text x="600" y="360" class="t2">I publish when a project feels finished.</text>
    <text x="600" y="390" class="t2">I stop when it stops being fun.</text>

    <text x="600" y="435" class="t3">A few things I keep coming back to:</text>
    <text x="600" y="465" class="t2">If it can run in the browser, it should.</text>
    <text x="600" y="495" class="t2">No tracking. No analytics.</text>
    <text x="600" y="525" class="t2">Everything is open source.</text>
    <text x="600" y="555" class="t2">Small and finished beats big and abandoned.</text>

    <text x="600" y="600" class="t2">Some of what's here is complete.</text>
    <text x="600" y="630" class="t2">Some is a sketch I may never touch again.</text>
    <text x="600" y="660" class="t2">I don't dress any of it up.</text>
    <text x="600" y="690" class="t2">I'm happy to hear about freelance work,</text>
    <text x="600" y="720" class="t2">internships, or just a project worth the time.</text>

    <text x="600" y="765" class="t4">&gt; contact</text>
    <text x="600" y="795" class="t2">email    : mohamed005cheikh@gmail.com</text>
    <text x="600" y="825" class="t2">whatsapp : +222 30 72 64 75</text>

    <text x="600" y="875" class="t4">↓ Scan for everything ↓</text>
  </g>
</svg>
