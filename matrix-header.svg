    <text x="860" y="0" class="fall f4">0011</text>
    <text x="890" y="0" class="fall f5">1001</text>
    <text x="920" y="0" class="fall f1">0111</text>
    <text x="950" y="0" class="fall f3">1101</text>
    <text x="980" y="0" class="fall f2">0010</text>
    <text x="1010" y="0" class="fall f4">1011</text>
    <text x="1040" y="0" class="fall f5">0100</text>
    <text x="1070" y="0" class="fall f1">1110</text>
    <text x="1100" y="0" class="fall f3">1000</text>
    <text x="1130" y="0" class="fall f2">0110</text>
    <text x="1160" y="0" class="fall f4">1101</text>
  </g>
</svg>
