<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
  <rect width="100%" height="100%" fill="#05020a" />
  <style>
    .m { font-family: 'Courier New', monospace; font-size: 16px; fill: #00ff41; font-weight: bold; opacity: 0; }
    .glow { filter: drop-shadow(0 0 4px #00ff41); }
    .fall { animation: fall 3s linear infinite; }
    .f1 { animation-duration: 2.5s; animation-delay: 0s; }
    .f2 { animation-duration: 3.5s; animation-delay: 0.5s; }
    .f3 { animation-duration: 2s; animation-delay: 1s; }
    .f4 { animation-duration: 4s; animation-delay: 1.5s; }
    .f5 { animation-duration: 2.8s; animation-delay: 2s; }
    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(200px); opacity: 0; }
    }
  </style>
  <g class="m glow">
    <text x="20" y="0" class="fall f1">0101</text>
    <text x="50" y="0" class="fall f3">1100</text>
    <text x="80" y="0" class="fall f2">1010</text>
    <text x="110" y="0" class="fall f4">0110</text>
    <text x="140" y="0" class="fall f5">0011</text>
    <text x="170" y="0" class="fall f1">1001</text>
    <text x="200" y="0" class="fall f3">0111</text>
    <text x="230" y="0" class="fall f2">1101</text>
    <text x="260" y="0" class="fall f4">0010</text>
    <text x="290" y="0" class="fall f5">1011</text>
    <text x="320" y="0" class="fall f1">0100</text>
    <text x="350" y="0" class="fall f3">1110</text>
    <text x="380" y="0" class="fall f2">1000</text>
    <text x="410" y="0" class="fall f4">0110</text>
    <text x="440" y="0" class="fall f5">1101</text>
    <text x="470" y="0" class="fall f1">0011</text>
    <text x="500" y="0" class="fall f3">1010</text>
    <text x="530" y="0" class="fall f2">0101</text>
    <text x="560" y="0" class="fall f4">1111</text>
    <text x="590" y="0" class="fall f5">0000</text>
    <text x="620" y="0" class="fall f1">1010</text>
    <text x="650" y="0" class="fall f3">0110</text>
    <text x="680" y="0" class="fall f2">1001</text>
    <text x="710" y="0" class="fall f4">1100</text>
