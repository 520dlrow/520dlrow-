<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="seaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#8a5a44"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#seaBg)"/>

  <!-- Moving Waves -->
  <path fill="url(#wave1)" opacity="0.6">
    <animate attributeName="d"
      values="M0,200 Q300,160 600,200 T1200,200 L1200,400 L0,400 Z;
              M0,200 Q300,240 600,200 T1200,200 L1200,400 L0,400 Z;
              M0,200 Q300,160 600,200 T1200,200 L1200,400 L0,400 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave2)" opacity="0.8">
    <animate attributeName="d"
      values="M0,240 Q400,200 800,240 T1200,240 L1200,400 L0,400 Z;
              M0,240 Q400,280 800,240 T1200,240 L1200,400 L0,400 Z;
              M0,240 Q400,200 800,240 T1200,240 L1200,400 L0,400 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#wave3)" opacity="0.9">
    <animate attributeName="d"
      values="M0,280 Q500,250 1000,280 T1200,280 L1200,400 L0,400 Z;
              M0,280 Q500,310 1000,280 T1200,280 L1200,400 L0,400 Z;
              M0,280 Q500,250 1000,280 T1200,280 L1200,400 L0,400 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- The Island -->
  <path d="M 800 400 L 800 300 Q 900 250 1000 280 Q 1100 300 1200 280 L 1200 400 Z" fill="url(#sand)"/>
  <path d="M 850 400 L 850 320 Q 950 280 1050 300 Q 1150 320 1200 300 L 1200 400 Z" fill="#c38d59" opacity="0.5"/>

  <!-- Palm Tree (From user's provided SVG, adjusted to fit) -->
  <g transform="translate(150, -50) scale(1.2)">
    <!-- Trunk -->
    <path d="M 605 555 Q 625 300 575 95 L 595 95 Q 650 300 630 555 Z" fill="#61462a" />
    <!-- Leaves -->
    <g fill="#125a3a">
      <path d="M 580 95 Q 440 70 420 140 Q 490 100 580 95 Z" />
      <path d="M 580 95 Q 480 160 480 230 Q 530 170 580 95 Z" />
      <path d="M 580 95 Q 540 -40 470 -30 Q 530 30 580 95 Z" />
      <path d="M 580 95 Q 640 -50 700 -30 Q 640 30 580 95 Z" />
      <path d="M 580 95 Q 690 90 750 150 Q 680 120 580 95 Z" />
      <path d="M 580 95 Q 670 170 680 240 Q 630 180 580 95 Z" />
      <path d="M 580 95 Q 580 190 600 240 Q 610 160 580 95 Z" />
    </g>
  </g>

  <!-- Stick Man Sitting -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head -->
    <circle cx="880" cy="280" r="12" fill="#f8fafc" />
    <!-- Body -->
    <line x1="880" y1="292" x2="880" y2="330" />
    <!-- Arms resting on knees -->
    <path d="M 880 305 L 860 320 L 870 335" />
    <path d="M 880 305 L 900 320 L 890 335" />
    <!-- Legs bent -->
    <path d="M 880 330 L 860 350" />
    <path d="M 880 330 L 900 350" />
  </g>
</svg>
