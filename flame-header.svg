<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04080f"/>
      <stop offset="60%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#132238"/>
    </linearGradient>

    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4d73"/>
      <stop offset="100%" stop-color="#152a42"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b5f8a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b82b3"/>
      <stop offset="100%" stop-color="#2d4d73"/>
    </linearGradient>

    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>
  <circle cx="960" cy="65" r="90" fill="url(#moon)"/>
  <circle cx="960" cy="65" r="22" fill="#e0f2fe" opacity="0.9"/>

  <g fill="#dbeafe">
    <circle cx="120" cy="55" r="1" opacity="0.6"/>
    <circle cx="260" cy="40" r="0.8" opacity="0.4"/>
    <circle cx="400" cy="85" r="1.2" opacity="0.7"/>
    <circle cx="560" cy="50" r="0.9" opacity="0.5"/>
    <circle cx="700" cy="95" r="1" opacity="0.6"/>
    <circle cx="830" cy="45" r="0.7" opacity="0.4"/>
    <circle cx="1080" cy="60" r="1.1" opacity="0.7"/>
    <circle cx="1150" cy="110" r="0.8" opacity="0.5"/>
  </g>

  <!-- Layer 1 (farthest) -->
  <g fill="url(#c1)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -15,0; 0,0" dur="30s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="235" rx="200" ry="48"/>
    <ellipse cx="500" cy="245" rx="220" ry="52"/>
    <ellipse cx="850" cy="240" rx="230" ry="50"/>
    <ellipse cx="1120" cy="245" rx="180" ry="46"/>
  </g>

  <!-- Layer 2 -->
  <g fill="url(#c2)" opacity="0.88">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 12,0; 0,0" dur="25s" repeatCount="indefinite"/>
    <ellipse cx="230" cy="252" rx="170" ry="44"/>
    <ellipse cx="580" cy="258" rx="190" ry="48"/>
    <ellipse cx="900" cy="255" rx="180" ry="45"/>
  </g>

  <!-- Layer 3 -->
  <g fill="url(#c3)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -9,0; 0,0" dur="20s" repeatCount="indefinite"/>
    <ellipse cx="380" cy="268" rx="160" ry="40"/>
    <ellipse cx="720" cy="272" rx="170" ry="42"/>
    <ellipse cx="1050" cy="268" rx="150" ry="40"/>
  </g>

  <!-- Layer 4 (closest, brightest) -->
  <g fill="url(#c4)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 8,0; 0,0" dur="15s" repeatCount="indefinite"/>
    <ellipse cx="200" cy="282" rx="150" ry="38"/>
    <ellipse cx="520" cy="284" rx="160" ry="38"/>
    <ellipse cx="860" cy="282" rx="170" ry="38"/>
    <ellipse cx="1160" cy="284" rx="130" ry="36"/>
  </g>

  <text x="600" y="105" text-anchor="middle"
    font-family="Cinzel, Georgia, serif"
    font-size="58" font-weight="700" fill="#e0f2fe" letter-spacing="3">
    Mohamed Cheikh
  </text>

  <text x="600" y="142" text-anchor="middle"
    font-family="Cinzel, Georgia, serif"
    font-size="14" font-weight="600" fill="#93c5fd" letter-spacing="6">
    MC88 · HOBBYIST WEB BUILDER
  </text>
</svg>
