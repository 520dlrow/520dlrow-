<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gradBase" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a001a"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
    <linearGradient id="gradBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="gradMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gradFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>
  
  <style>
    .bg { fill: url(#gradBase); }
    .flame { transform-origin: bottom center; }
    .f1 { animation: flicker 1.5s infinite alternate ease-in-out; }
    .f2 { animation: flicker 2.2s infinite alternate-reverse ease-in-out; }
    .f3 { animation: flicker 1.8s infinite alternate ease-in-out; }
    .f4 { animation: flicker 2.5s infinite alternate-reverse ease-in-out; }
    
    @keyframes flicker {
      0% { transform: scaleY(1) scaleX(1) skewX(0deg); opacity: 0.8; }
      50% { transform: scaleY(1.15) scaleX(0.95) skewX(2deg); opacity: 1; }
      100% { transform: scaleY(0.9) scaleX(1.05) skewX(-2deg); opacity: 0.7; }
    }
  </style>
  
  <rect width="100%" height="100%" class="bg" />

  <!-- Background Layer: Dark, broad, wispy shapes -->
  <g class="flame f4" fill="url(#gradBack)" opacity="0.6">
    <path d="M 0,300 L 50,150 L 80,180 L 100,80 L 130,160 L 180,50 L 200,140 L 250,300 Z" />
    <path d="M 200,300 L 280,180 L 310,220 L 350,100 L 380,190 L 450,60 L 480,170 L 520,300 Z" />
    <path d="M 450,300 L 550,130 L 580,200 L 650,70 L 680,180 L 750,90 L 780,200 L 850,300 Z" />
    <path d="M 800,300 L 880,160 L 920,210 L 980,80 L 1020,170 L 1080,50 L 1120,150 L 1200,300 Z" />
  </g>

  <!-- Mid Layer: Sharper, brighter purple -->
  <g class="flame f2" fill="url(#gradMid)" opacity="0.8">
    <path d="M 0,300 L 30,180 L 60,220 L 90,100 L 120,190 L 160,120 L 190,210 L 230,300 Z" />
    <path d="M 180,300 L 250,150 L 280,230 L 320,80 L 350,180 L 420,110 L 460,220 L 500,300 Z" />
    <path d="M 420,300 L 520,140 L 550,220 L 600,60 L 640,190 L 700,100 L 740,210 L 800,300 Z" />
    <path d="M 750,300 L 830,170 L 870,240 L 920,90 L 960,200 L 1020,120 L 1060,220 L 1120,300 Z" />
  </g>

  <!-- Front Layer: Brightest, most detailed, sharpest tendrils -->
  <g class="flame f1" fill="url(#gradFront)" opacity="0.9">
    <path d="M 0,300 L 20,220 L 40,250 L 70,150 L 90,240 L 120,180 L 150,260 L 180,300 Z" />
    <path d="M 140,300 L 190,200 L 210,260 L 250,120 L 280,230 L 320,160 L 360,250 L 400,300 Z" />
    <path d="M 350,300 L 420,180 L 450,250 L 500,100 L 540,220 L 580,140 L 620,240 L 680,300 Z" />
    <path d="M 600,300 L 680,190 L 720,260 L 770,130 L 810,240 L 860,160 L 900,250 L 950,300 Z" />
    <path d="M 850,300 L 920,200 L 960,270 L 1010,140 L 1050,250 L 1100,170 L 1140,260 L 1200,300 Z" />
  </g>
  
  <!-- Embers -->
  <g class="flame f3" fill="#d8b4fe">
    <circle cx="150" cy="100" r="2" />
    <circle cx="400" cy="150" r="3" />
    <circle cx="650" cy="80" r="2" />
    <circle cx="900" cy="120" r="3" />
    <circle cx="1100" cy="180" r="2" />
  </g>
</svg>
