<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="flameBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#12001f"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="flameFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #030005; }
    .flame {
      transform-origin: center bottom;
      animation: flicker 2s infinite ease-in-out alternate;
    }
    .back { animation-duration: 4s; animation-delay: 0.5s; }
    .mid { animation-duration: 3s; animation-delay: 1.5s; }
    .front { animation-duration: 2s; animation-delay: 0.2s; }
    
    .sway1 { animation: sway 3s infinite ease-in-out alternate; }
    .sway2 { animation: sway 4s infinite ease-in-out alternate-reverse; }

    @keyframes flicker {
      0% { transform: scaleY(1) scaleX(1); opacity: 0.7; }
      100% { transform: scaleY(1.1) scaleX(0.95); opacity: 1; }
    }
    @keyframes sway {
      0% { transform: translateX(0px) scaleY(1); }
      100% { transform: translateX(15px) scaleY(1.05); }
    }
  </style>
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Background Flames -->
  <g class="flame back">
    <path d="M 0 300 Q 100 200 150 100 Q 200 150 250 300 Z" fill="url(#flameBack)"/>
    <path d="M 200 300 Q 300 150 400 50 Q 500 150 600 300 Z" fill="url(#flameBack)"/>
    <path d="M 500 300 Q 600 180 700 80 Q 800 180 900 300 Z" fill="url(#flameBack)"/>
    <path d="M 800 300 Q 900 200 1000 100 Q 1100 200 1200 300 Z" fill="url(#flameBack)"/>
  </g>

  <!-- Mid Flames -->
  <g class="flame mid sway1">
    <path d="M 50 300 C 150 200, 50 100, 150 50 C 200 20, 250 100, 200 200 C 150 300, 250 300, 300 300 Z" fill="url(#flameMid)"/>
    <path d="M 350 300 C 450 150, 350 50, 450 0 C 500 30, 550 120, 500 250 C 450 300, 550 300, 600 300 Z" fill="url(#flameMid)"/>
    <path d="M 650 300 C 750 200, 650 100, 750 50 C 800 20, 850 100, 800 200 C 750 300, 850 300, 900 300 Z" fill="url(#flameMid)"/>
    <path d="M 950 300 C 1050 150, 950 50, 1050 0 C 1100 30, 1150 120, 1100 250 C 1050 300, 1150 300, 1200 300 Z" fill="url(#flameMid)"/>
  </g>

  <!-- Front Flames -->
  <g class="flame front sway2">
    <path d="M 100 300 C 200 180, 100 80, 200 30 C 250 0, 300 80, 250 180 C 200 280, 300 300, 350 300 Z" fill="url(#flameFront)"/>
    <path d="M 400 300 C 500 150, 400 50, 500 10 C 550 -20, 600 60, 550 180 C 500 300, 600 300, 650 300 Z" fill="url(#flameFront)"/>
    <path d="M 700 300 C 800 180, 700 80, 800 30 C 850 0, 900 80, 850 180 C 800 280, 900 300, 950 300 Z" fill="url(#flameFront)"/>
    <path d="M 1000 300 C 1100 150, 1000 50, 1100 10 C 1150 -20, 1200 60, 1150 180 C 1100 300, 1200 300, 1250 300 Z" fill="url(#flameFront)"/>
  </g>
  
  <!-- Floating Embers -->
  <circle cx="200" cy="150" r="3" fill="#c084fc" class="flame front"/>
  <circle cx="500" cy="80" r="4" fill="#a855f7" class="flame mid"/>
  <circle cx="800" cy="200" r="2" fill="#c084fc" class="flame front"/>
  <circle cx="1100" cy="120" r="3" fill="#a855f7" class="flame back"/>
</svg>
